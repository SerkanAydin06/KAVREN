name: Godot project smoke test
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start the project with Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -qo "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          engine="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          "$engine" --headless --editor --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          "$engine" --headless --quit-after 10 2>&1 | tee "$RUNNER_TEMP/play.log"
          if grep -E 'SCRIPT ERROR|^ERROR:' "$RUNNER_TEMP/import.log" "$RUNNER_TEMP/play.log"; then exit 1; fi
